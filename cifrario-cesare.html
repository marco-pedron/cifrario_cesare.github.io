<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001CE0">
<link rel="icon" href="data:,">
<title>Cifrario di Cesare — BitGeneration</title>
<style>
:root{--blue:#001CE0;--bg:#F9F9F9;--soft:#A9B3F5;--tint:#E9ECFD;--mid:#6A7BEC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--blue);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:500}
header{background:var(--blue);color:#fff;padding:16px 20px 14px}
header .k{font-size:13px;color:var(--soft)}
header h1{margin:2px 0 0;font-size:26px;font-weight:500;letter-spacing:-.01em}
main{width:100%;max-width:560px;margin:0 auto;padding:14px 20px 28px}
.lab{display:block;font-size:13px;color:var(--mid);margin:16px 0 6px}
.wheelwrap{position:relative;width:100%;max-width:440px;margin:6px auto 0}
svg#wheel{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
svg#wheel:active{cursor:grabbing}
svg text{font-family:inherit;font-weight:500;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#inner{transition:transform .18s ease-out}
#inner.drag{transition:none}
.legend{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--mid);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--blue)}
.legend i.in{background:var(--blue)}
.keyrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
.btn{font:inherit;font-size:26px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);border-radius:12px;width:56px;height:52px;cursor:pointer}
.btn:active{background:var(--tint)}
.pair{font-size:18px;min-width:170px;text-align:center}
.pair b{font-weight:500;font-size:24px}
.seg{display:flex;border:1.5px solid var(--blue);border-radius:12px;overflow:hidden;margin-top:22px}
.seg button{flex:1;border:0;font:inherit;font-size:16px;padding:11px;background:transparent;color:var(--blue);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
textarea{width:100%;font:inherit;font-size:20px;letter-spacing:.04em;color:var(--blue);background:#fff;border:1.5px solid var(--blue);border-radius:12px;padding:12px 14px;outline:none;resize:vertical;min-height:58px}
textarea:focus{box-shadow:0 0 0 3px var(--tint)}
.out{background:var(--blue);color:#fff;border-radius:12px;padding:14px 16px;font-size:22px;letter-spacing:.05em;word-break:break-word;min-height:58px}
footer{text-align:center;font-size:12px;color:var(--mid);padding:0 20px 18px}
@media(prefers-reduced-motion:reduce){#inner{transition:none}}
</style>
</head>
<body>
<header>
  <div class="k">BitGeneration · BitPoliTO</div>
  <h1>Cifrario di Cesare</h1>
</header>
<main>
  <div class="wheelwrap">
    <svg id="wheel" viewBox="-205 -205 410 410" role="slider" tabindex="0" aria-label="Disco del cifrario: chiave" aria-valuemin="0" aria-valuemax="25" aria-valuenow="3">
      <circle r="200" fill="#F9F9F9" stroke="#001CE0" stroke-width="2"/>
      <g id="outer"></g>
      <g id="inner"></g>
      <circle r="62" fill="#F9F9F9" stroke="#001CE0" stroke-width="2"/>
      <text y="-22" font-size="13" fill="#6A7BEC">chiave</text>
      <text id="kNum" y="10" font-size="50" fill="#001CE0">3</text>
      <path d="M0 -203 l-9 -0.1 l9 13 l9 -13 z" fill="#001CE0" transform="translate(0,-2)"/>
    </svg>
  </div>
  <div class="legend"><span><i></i>Fuori: lettere in chiaro</span><span><i class="in"></i>Dentro: lettere cifrate</span></div>
  <div class="keyrow">
    <button class="btn" id="minus" aria-label="Chiave meno uno">−</button>
    <div class="pair" id="pair" aria-live="polite"></div>
    <button class="btn" id="plus" aria-label="Chiave più uno">+</button>
  </div>

  <div class="seg" role="group" aria-label="Modalità">
    <button id="mDec" aria-pressed="true">Decifra</button>
    <button id="mEnc" aria-pressed="false">Cifra</button>
  </div>
  <label class="lab" for="tin" id="tinLab">Parola cifrata</label>
  <textarea id="tin" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Scrivi qui"></textarea>
  <div class="lab" id="toutLab">Con questa chiave diventa</div>
  <div class="out" id="tout" aria-live="polite"></div>
</main>
<footer>Trascina il disco blu, oppure usa − e +, finché la parola diventa leggibile.</footer>

<script>
"use strict";
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg", STEP=360/26;
let key=3, enc=false;
function shift(text,k){k=((k%26)+26)%26;let o="";for(const ch of text){const c=ch.charCodeAt(0);
  if(c>=65&&c<=90)o+=String.fromCharCode((c-65+k)%26+65);else if(c>=97&&c<=122)o+=String.fromCharCode((c-97+k)%26+97);else o+=ch}return o}
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e}
function ring(g,r0,r1,rt,fill,ink,fs){
  g.append(el("circle",{r:r1,fill,stroke:"#001CE0","stroke-width":2}));
  for(let i=0;i<26;i++){
    const a=(i*STEP-90)*Math.PI/180, b=((i-.5)*STEP-90)*Math.PI/180;
    g.append(el("line",{x1:r0*Math.cos(b),y1:r0*Math.sin(b),x2:r1*Math.cos(b),y2:r1*Math.sin(b),stroke:ink,"stroke-opacity":.35,"stroke-width":1}));
    const t=el("text",{x:rt*Math.cos(a),y:rt*Math.sin(a),"font-size":fs,fill:ink,transform:`rotate(${i*STEP} ${rt*Math.cos(a)} ${rt*Math.sin(a)})`});
    t.textContent=String.fromCharCode(65+i);g.append(t);
  }
}
ring($("outer"),152,198,175,"#F9F9F9","#001CE0",24);
ring($("inner"),62,150,128,"#001CE0","#FFFFFF",24);

let angle=-key*STEP; // rotazione del disco interno in gradi
function paint(){
  $("inner").setAttribute("transform",`rotate(${angle})`);
  $("kNum").textContent=key;$("wheel").setAttribute("aria-valuenow",key);
  $("pair").innerHTML=`<b>A</b> diventa <b>${String.fromCharCode(65+key)}</b>`;
  $("tout").textContent=shift($("tin").value,enc?key:-key)||" ";
}
function setKey(k){key=((k%26)+26)%26;
  // scegli la rotazione equivalente più vicina a quella attuale, così l'animazione non fa il giro lungo
  let target=-key*STEP;while(target-angle>180)target-=360;while(target-angle<-180)target+=360;angle=target;paint()}
$("minus").onclick=()=>setKey(key-1);$("plus").onclick=()=>setKey(key+1);
$("wheel").addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowUp"){setKey(key+1);e.preventDefault()}if(e.key==="ArrowLeft"||e.key==="ArrowDown"){setKey(key-1);e.preventDefault()}});

// trascinamento
const svg=$("wheel");let drag=null;
function ptAngle(e){const r=svg.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
svg.addEventListener("pointerdown",e=>{drag={a0:ptAngle(e),start:angle};$("inner").classList.add("drag");svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{if(!drag)return;let d=ptAngle(e)-drag.a0;angle=drag.start+d;
  key=((Math.round(-angle/STEP)%26)+26)%26;paint()});
function endDrag(){if(!drag)return;drag=null;$("inner").classList.remove("drag");angle=-Math.round(-angle/STEP)*STEP;paint()}
svg.addEventListener("pointerup",endDrag);svg.addEventListener("pointercancel",endDrag);

function setMode(e){enc=e;$("mEnc").setAttribute("aria-pressed",e);$("mDec").setAttribute("aria-pressed",!e);
  $("tinLab").textContent=e?"Parola in chiaro":"Parola cifrata";$("toutLab").textContent=e?"Cifrata con questa chiave diventa":"Con questa chiave diventa";paint()}
$("mEnc").onclick=()=>setMode(true);$("mDec").onclick=()=>setMode(false);
$("tin").oninput=paint;
paint();
</script>
</body>
</html>
